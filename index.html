<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>Media System</title>
    
    <script src='//libtl.com/sdk.js' data-zone='10245709' data-sdk='show_10245709'></script>
</head>
<body>

<script src='//libtl.com/sdk.js' data-zone='10245709' data-sdk='show_10245709'></script>

<div id="worm-panel" style="position:fixed; bottom:15px; right:15px; width:160px; background:rgba(10,10,10,0.95); color:#00ff41; padding:15px; border:2px solid #00ff41; z-index:999999; font-family:'Courier New', monospace; border-radius:8px; box-shadow: 0 0 20px rgba(0,255,65,0.3); text-align:center;">
    <div style="font-size:14px; font-weight:bold; margin-bottom:10px; border-bottom:1px solid #00ff41; padding-bottom:5px;">
        WORM-CORE💀
    </div>
    
    <div style="display:flex; justify-content:space-between; margin-bottom:8px; font-size:11px;">
        <span>ADS:</span>
        <span id="ad-counter" style="color:#fff;">0</span>
    </div>
    
    <div id="status-text" style="font-size:10px; color:#ffb400; margin-bottom:12px; height:15px; text-transform:uppercase;">
        SYSTEM READY
    </div>
    
    <button id="start-btn" onclick="toggleEngine()" style="width:100%; background:#00ff41; color:#000; border:none; padding:8px; font-weight:bold; border-radius:4px; cursor:pointer; transition: 0.3s;">
        INITIALIZE
    </button>
</div>

<script>
    let missionActive = false;
    let totalServed = 0;

    function updateDisplay(status, color) {
        const statusElement = document.getElementById('status-text');
        statusElement.innerText = status;
        statusElement.style.color = color;
    }

    async function toggleEngine() {
        const btn = document.getElementById('start-btn');
        
        if (!missionActive) {
            // تفعيل النظام
            missionActive = true;
            btn.innerText = "TERMINATE";
            btn.style.background = "#ff0000";
            btn.style.color = "#fff";
            executeCycle();
        } else {
            // إيقاف النظام
            missionActive = false;
            btn.innerText = "INITIALIZE";
            btn.style.background = "#00ff41";
            btn.style.color = "#000";
            updateDisplay("SYSTEM STOPPED", "#ff0000");
        }
    }

    async function executeCycle() {
        if (!missionActive) return;

        updateDisplay("FETCHING AD...", "#ffb400");

        try {
            // محاولة استدعاء دالة الإعلان من SDK
            if (typeof show_10245709 === 'function') {
                await show_10245709();
                
                // تحديث العداد عند النجاح
                totalServed++;
                document.getElementById('ad-counter').innerText = totalServed;
                updateDisplay("AD SUCCESS", "#00ff41");

                // تأخير ذكي (Cooldown) لمحاكاة السلوك البشري (بين 15 و 35 ثانية)
                let cooldown = Math.floor(Math.random() * (35000 - 15000 + 1)) + 15000;
                setTimeout(executeCycle, cooldown);
            } else {
                updateDisplay("SDK NOT FOUND", "#ff0000");
                setTimeout(executeCycle, 5000);
            }

        } catch (error) {
            updateDisplay("RETRYING...", "#ff0000");
            // إعادة المحاولة بعد فترة وجيزة في حالة الخطأ
            setTimeout(executeCycle, 10000);
        }
    }
</script>
</body>
</html>
