<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Monetag Test</title>
</head>
<body>

  <h2>Test Ads</h2>

  <button onclick="showInApp()">Show In-App Interstitial</button>
  <button onclick="showRewarded()">Show Rewarded Popup</button>

  <script>
    // In-App Interstitial
    function showInApp() {
      show_10245709({
        type: 'inApp',
        inAppSettings: {
          frequency: 2,
          capping: 0.1,
          interval: 30,
          timeout: 5,
          everyPage: false
        }
      });
    }

    // Rewarded Popup
    function showRewarded() {
      show_10245709('pop')
        .then(() => {
          alert("Ad completed → give reward to user");
          // هنا تحط مكافأتك (coins / points)
        })
        .catch(() => {
          alert("Ad not completed or error");
        });
    }
  </script>

</body>
</html>
